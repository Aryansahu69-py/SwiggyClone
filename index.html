<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Swiggy</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link href="https://cdn.jsdelivr.net/npm/remixicon@4.9.0/fonts/remixicon.css" rel="stylesheet" />

</head>
<style>
    @font-face {
        font-family: gilroy;
        src: url(https://media-assets.swiggy.com/dls-web-assets/dls/fonts/Gilroy-Medium.woff2);
    }
</style>

<body class="h-screen">
    <main class=" h-full max-h-[96%] relative w-screen bg-[#FF5200] flex flex-col items-center ">
        <nav class="flex w-full justify-between text-[16px] items-center px-[9%] py-[2%] text-white  ">
            <img class="h-fit cursor-pointer max-w-[30%] sm:w-[25%] md:w-[20%] lg:w-[14%]"
                src="https://media-assets.swiggy.com/swiggy/image/upload/fl_lossy,f_auto,q_auto/portal/static-assets/images/swiggy_logo_white.png"
                alt="">
            <div class="flex gap-6 text-xl font-[gilroy] text-[16px] items-center">
                <p class="font-[600] cursor-pointer">Swiggy Corporate</p>
                <p class="font-[600] cursor-pointer">Partner with us</p>
                <button class="font-[800]  border border-white-600 px-4 py-[15px]  rounded-xl cursor-pointer">Get the
                    App <i class="ri-arrow-right-up-long-line cursor-pointer"></i></button>
                <button class="font-[800] bg-black border-2 border-black px-10 py-[13px] rounded-xl cursor-pointer">Sign
                    In</button>

            </div>
        </nav>
        <section class="w-full mt-8  flex flex-col items-center">
            <h1 class="font-[gilroy] text-white text-[3vmax] leading-15 font-[700] text-center">Order food & groceries.
                Discover<br> best restaurants. Swiggy it!
            </h1>
            <div class="flex mt-3 w-full justify-center ">
                <div class="bg-white rounded-xl p-2 flex items-center gap-3 w-[300px] ">
                    <i class="ri-map-pin-line text-[25px] text-[#FF5200]"></i>
                    <input class="text-[16px] w-full font-[gilroy]  outline-none " type="text"
                        placeholder="Enter your delivery location">
                    <i class="ri-arrow-down-s-line text-[30px] "></i>
                </div>
                <div class="bg-white rounded-xl p-2 flex items-center ml-[19px] w-[450px]">

                    <input class="text-[17px] w-full ml-[10px] font-bold font-[gilroy] outline-none " type="text"
                        placeholder="Search for restaurant, item or more">
                    <i class="ri-search-line text-[20px]"></i>
                </div>
            </div>
            <div class="flex ml-[9.5%] mt-[1.9%] ">
                <img class=" max-w-[32%] max-h-[95%]  cursor-pointer"
                    src="https://media-assets.swiggy.com/swiggy/image/upload/fl_lossy,f_auto,q_auto/MERCHANDISING_BANNERS/IMAGES/MERCH/2024/7/23/ec86a309-9b06-48e2-9adc-35753f06bc0a_Food3BU.png"
                    alt="">
                <img class=" max-w-[32%] max-h-[92%] cursor-pointer"
                    src="https://media-assets.swiggy.com/swiggy/image/upload/fl_lossy,f_auto,q_auto/MERCHANDISING_BANNERS/IMAGES/MERCH/2024/7/23/b5c57bbf-df54-4dad-95d1-62e3a7a8424d_IM3BU.png"
                    alt="">
                <img class=" max-w-[32%] max-h-[92%]  cursor-pointer"
                    src="https://media-assets.swiggy.com/swiggy/image/upload/fl_lossy,f_auto,q_auto/MERCHANDISING_BANNERS/IMAGES/MERCH/2024/7/23/b6d9b7ab-91c7-4f72-9bf2-fcd4ceec3537_DO3BU.png"
                    alt="">
            </div>
            <div class="bg-white mt-[0.005%] ml-[3%] w-[78%] h-2 flex justify-between">

            </div>
            <img class="absolute max-w-[15.5%] left-0 top-[9%]"
                src="https://media-assets.swiggy.com/swiggy/image/upload/fl_lossy,f_auto,q_auto/portal/testing/seo-home/Veggies_new.png"
                alt="">
            <img class=" max-w-[15.5%] absolute right-0 top-[8%] "
                src="https://media-assets.swiggy.com/swiggy/image/upload/fl_lossy,f_auto,q_auto/portal/testing/seo-home/Sushi_replace.png"
                alt="">

        </section>

    </main>
</body>

</html>
